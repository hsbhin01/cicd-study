name: CI

# 언제 실행할지 (트리거)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN 권한 최소화: 코드 읽기만 허용
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest   # GitHub이 제공하는 클라우드 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"        # 로컬과 같은 버전
          python-version: "3.13"
          enable-cache: true                  # uv가 내려받은 패키지를 GitHub 캐시에 저장/복원
          cache-dependency-glob: "uv.lock"    # 캐시 키: uv.lock이 바뀌면 새 캐시

      - name: Install dependencies
        run: uv sync --frozen      # uv.lock과 다르면 실패

      # 로컬에서 쓰는 명령과 똑같이 실행 (01 노트 원칙)
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test (with coverage)
        run: uv run pytest -v --cov

      # 커버리지 표를 Actions 실행 화면의 Summary에 표시
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
