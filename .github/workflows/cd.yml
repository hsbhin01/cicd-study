name: CD

# main이 바뀔 때만 실행 (PR에서는 실행되지 않음)
# branch protection 때문에 main에 들어온 코드는 이미 CI를 통과한 상태입니다.
on:
  push:
    branches: [main]
  workflow_dispatch:          # Actions 화면에서 수동 실행 버튼

permissions:
  contents: read
  packages: write             # GHCR에 이미지를 push하려면 필요

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # hsbhin01/cicd-study

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BuildKit 기반 빌더 준비 (멀티스테이지, 캐시 기능 사용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 로그인: 별도 비밀번호 없이 워크플로우가 자동으로 받는 GITHUB_TOKEN 사용
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 이름과 태그 계산
      #   sha-<7자리 커밋 SHA> : 배포에 쓰는 불변 태그
      #   latest               : 편의용 (배포에는 쓰지 않음)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # 이전 빌드의 레이어 캐시 재사용
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
