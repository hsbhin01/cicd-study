# Dependabot: 의존성의 새 버전이 나오면 업데이트 PR을 자동으로 만듭니다.
# 만들어진 PR에서도 CI(lint, test, image-scan)가 돌기 때문에, 통과한 업데이트만 머지하면 됩니다.
version: 2
updates:
  # Python 패키지 (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:          # 마이너/패치 업데이트는 PR 하나로 묶음 (PR 폭탄 방지)
        update-types: ["minor", "patch"]

  # GitHub Actions (워크플로우의 uses: ... SHA와 버전 주석)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile의 베이스 이미지 (FROM ...@sha256 digest)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Python 버전(3.13 → 3.15 등)은 자동으로 올리지 않음.
      # CI 테스트는 3.13에서만 돌기 때문에, 이미지만 바꾸면 개발/운영 Python이 어긋남.
      # 같은 3.13-slim 태그의 digest 갱신(보안 패치 반영)만 받음.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
