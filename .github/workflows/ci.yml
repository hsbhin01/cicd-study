name: CI

# 언제 실행할지 (트리거)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN 권한 최소화: 코드 읽기만 허용
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest   # GitHub이 제공하는 클라우드 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"        # 로컬과 같은 버전
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen      # uv.lock과 다르면 실패

      # 로컬에서 쓰는 명령과 똑같이 실행 (01 노트 원칙)
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v
