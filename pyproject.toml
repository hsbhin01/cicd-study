[project]
name = "cicd-study"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.6",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]          # 측정 대상: 앱 코드만 (테스트 코드는 제외)

[tool.coverage.report]
show_missing = true       # 실행되지 않은 줄 번호 표시
fail_under = 90           # 커버리지가 90% 미만이면 실패 → CI도 실패
