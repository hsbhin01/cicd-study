name: CI

# 언제 실행할지 (트리거)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN 권한 최소화: 코드 읽기만 허용
permissions:
  contents: read

# Action은 태그(@v4) 대신 커밋 SHA로 고정합니다 (태그는 작성자가 옮길 수 있음).
# 뒤의 주석이 사람이 읽는 버전이며, Dependabot이 SHA와 주석을 함께 업데이트합니다.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest   # GitHub이 제공하는 클라우드 runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.6.14"        # 로컬과 같은 버전
          python-version: "3.13"
          enable-cache: true                  # uv가 내려받은 패키지를 GitHub 캐시에 저장/복원
          cache-dependency-glob: "uv.lock"    # 캐시 키: uv.lock이 바뀌면 새 캐시

      - name: Install dependencies
        run: uv sync --frozen      # uv.lock과 다르면 실패

      # 로컬에서 쓰는 명령과 똑같이 실행 (01 노트 원칙)
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test (with coverage)
        run: uv run pytest -v --cov

      # 커버리지 표를 Actions 실행 화면의 Summary에 표시
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # 이미지를 빌드만 하고(push 안 함) 알려진 취약점(CVE)을 스캔합니다.
  # PR 단계에서 실행하므로, 머지 전에 결과를 볼 수 있습니다.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true                 # runner의 docker에 이미지를 올려 스캔할 수 있게 함
          push: false
          tags: cicd-study:scan
          cache-from: type=gha       # CD가 저장한 레이어 캐시 재사용 (저장은 하지 않음)

      # 1) 리포트: HIGH, CRITICAL 목록을 Summary에 표시 (실패시키지 않음)
      - name: Scan report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cicd-study:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true       # 고친 버전이 아직 없는 취약점은 제외 (지금 할 수 있는 조치가 없으므로)
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Scan summary
        if: always()
        run: |
          echo "### Trivy scan (HIGH, CRITICAL, fixable only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # tee: Summary 탭과 실행 로그 양쪽에 출력
          cat trivy-report.txt | tee -a "$GITHUB_STEP_SUMMARY" || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 2) 관문: 고칠 수 있는 CRITICAL이 하나라도 있으면 실패
      - name: Scan gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cicd-study:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true     # 앞 step에서 설치한 trivy 재사용
