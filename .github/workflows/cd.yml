name: CD

# main이 바뀔 때만 실행 (PR에서는 실행되지 않음)
# branch protection 때문에 main에 들어온 코드는 이미 CI를 통과한 상태입니다.
on:
  push:
    branches: [main]
    paths-ignore:             # 문서만 바뀐 경우에는 이미지를 새로 만들지 않음
      - "notes/**"
      - "**.md"
  workflow_dispatch:          # Actions 화면에서 수동 실행 버튼

permissions:
  contents: read
  packages: write             # GHCR에 이미지를 push하려면 필요

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # hsbhin01/cicd-study

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # amd64 runner에서 arm64용 바이너리를 실행할 수 있도록 에뮬레이터(QEMU) 설치
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # BuildKit 기반 빌더 준비 (멀티스테이지, 캐시, 멀티 아키텍처 빌드)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR 로그인: 별도 비밀번호 없이 워크플로우가 자동으로 받는 GITHUB_TOKEN 사용
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 이름과 태그 계산
      #   sha-<7자리 커밋 SHA> : 배포에 쓰는 불변 태그
      #   latest               : 편의용 (배포에는 쓰지 않음)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # 하나의 태그에 두 아키텍처 이미지
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # 이전 빌드의 레이어 캐시 재사용
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
